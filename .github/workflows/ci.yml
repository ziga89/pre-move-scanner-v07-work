name: v0.7 CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: pre_move_scanner_v07_work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Python syntax check
        run: python -m compileall -q server tools tests
      - name: Unit, fixture and scenario tests (incl. FastAPI, WebSocket, real ccxt, worker processes)
        run: python -m unittest discover -s tests -t . -v
      - name: Exchange capability matrix from the installed ccxt (no network)
        run: python tools/print_capabilities.py
      - name: Self-test tool, offline SIM mode
        run: python tools/selftest.py --sim --seconds 8
      - name: Windows launcher end-to-end (venv, pip, comma arguments, exit code)
        if: runner.os == 'Windows' && matrix.python == '3.12'
        shell: cmd
        env:
          PMS_NO_PAUSE: "1"
        run: run_windows.bat selftest --sim --seconds 4 --repeat 2 --assets QNT,XDC,LINK

  web:
    name: web UI (JS syntax, lint, headless browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pre_move_scanner_v07_work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: JS syntax check
        run: for f in web/js/*.js web/sw.js; do node --check "$f"; done
      - name: ESLint
        run: npx --yes eslint@9 web
      - name: Playwright UI smoke test (SIM mode, stdlib dev server)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          python tests/ui/run_ui_smoke.py ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: pre_move_scanner_v07_work/ui-screenshots

  v06-integrity:
    name: original v0.6 folder unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SHA-256 manifest
        run: cd pre_move_scanner_v06_history && sha256sum -c ../v06_manifest.sha256
